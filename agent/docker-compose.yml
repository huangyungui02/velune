services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  agent-api:
    build:
      context: .
    env_file:
      - .env
    environment:
      PORT: 8000
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      TASKIQ_QUEUE_NAME: souler_resolution
      # HTTP_PROXY: ${DOCKER_HTTP_PROXY:-http://host.docker.internal:7897}
      # HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-http://host.docker.internal:7897}
      # NO_PROXY: ${DOCKER_NO_PROXY:-localhost,127.0.0.1,redis,host.docker.internal}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  agent-worker:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      TASKIQ_QUEUE_NAME: souler_resolution
      # HTTP_PROXY: ${DOCKER_HTTP_PROXY:-http://host.docker.internal:7897}
      # HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-http://host.docker.internal:7897}
      # NO_PROXY: ${DOCKER_NO_PROXY:-localhost,127.0.0.1,redis,host.docker.internal}
    command: ["taskiq", "worker", "app.tasks.broker:broker", "app.tasks.souler_resolution"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
